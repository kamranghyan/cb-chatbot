[tool.poetry]
name = "cb-netflix-rag"
version = "2.0.0"
description = "Modernized multi-tenant RAG backend (Phase 0 boilerplate)"
authors = ["Irfan"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# --- Web ---
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }   # standard => websockets + uvloop
sse-starlette = "^2.1.0"                                    # SSE streaming responses

# --- Config ---
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"

# --- DB / Cache ---
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
asyncpg = "^0.29.0"
alembic = "^1.13.0"
redis = "^5.0.0"

# --- LangChain ecosystem (latest, replaces langchain 0.2.6) ---
langchain = "^0.3.0"
langchain-core = "^0.3.0"
langchain-aws = "^0.2.0"          # ChatBedrockConverse + BedrockEmbeddings
langchain-postgres = "^0.0.12"    # modern PGVector (replaces langchain_community.PGVector)
langsmith = "^0.1.120"            # tracing

# --- AWS ---
boto3 = "^1.35.0"

# --- Misc ---
python-jose = "^3.3.0"
shortuuid = "^1.0.13"
python-json-logger = "^2.0.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
black = "^24.8.0"
ruff = "^0.6.0"

[tool.black]
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
