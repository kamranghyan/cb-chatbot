<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Component Embed Example</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f5f4ff;
        color: #1b1d28;
      }
      .page {
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      code {
        background: #e4e2f7;
        padding: 2px 6px;
        border-radius: 4px;
      }
      /* Deliberately aggressive host-page CSS to prove Shadow DOM isolation:
         if the widget were NOT shadow-isolated, this would break it. */
      button {
        all: unset;
        font-size: 40px !important;
        color: red !important;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Web Component embed — <code>&lt;chat-widget&gt;</code></h1>
      <p>
        This page intentionally has a hostile global <code>button { all: unset; }</code>
        rule in its stylesheet. Notice the chat launcher button still renders
        correctly — that's Shadow DOM CSS isolation at work, one of the core
        requirements.
      </p>
    </div>

    <script src="./embed-webcomponent.js" type="module"></script>
    <chat-widget id="widget"></chat-widget>

    <script>
      // Config is passed as a JS property (config-url based JSON config is
      // planned for a later step — see README "Next steps"). We wait for
      // the custom element definition to load before setting it.
      customElements.whenDefined('chat-widget').then(() => {
        document.getElementById('widget').config = {
          botName: 'Web Component Bot',
          welcomeMessage: 'Rendered inside a Shadow DOM — host CSS cannot touch me.',
          startOpen: true,
          position: 'bottom-right',
          protocol: { type: 'mock' }
        }
      })
    </script>
  </body>
</html>
