<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Widget — Single-File Embed Demo</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f0f1f5;
        color: #1b1d28;
      }
      .page {
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      code {
        background: #e4e4ee;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Plain HTML page — no React, no build tools</h1>
      <p>
        This entire page is a static <code>index.html</code>. The chat widget in the
        bottom-right corner is added with exactly <strong>one script tag</strong> —
        <code>embed-standalone.js</code> — which bundles React and all styles inside it.
      </p>
      <p>Type <code>hello</code>, <code>pricing</code>, or <code>help</code> in the chat to see dummy replies.</p>
    </div>

    <!-- Step 1: include the single built file -->
    <script src="./embed-standalone.js"></script>

    <!-- Step 2: initialize with a config object -->
    <script>
      ChatWidgetKit.init({
        target: '#chat-root',
        config: {
          botName: 'Demo Assistant',
          welcomeMessage: 'Hi! How can I help?',
          placeholderText: 'Ask me something…',
          position: 'bottom-right',
          showTimestamps: true,
          fullScreenOnMobile: true,
          protocol: { type: 'mock' } // swap to 'http' | 'websocket' | 'stream' when ready
        }
      })
    </script>

    <!-- Mount point the widget attaches to -->
    <div id="chat-root"></div>
  </body>
</html>
